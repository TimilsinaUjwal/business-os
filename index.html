<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business OS</title>
<style>
  :root{ --navy:#16294A; --navy-2:#1F3A66; --gold:#E0A44A; --bg:#F5F6F9; --card:#FFFFFF; --ink:#1B2436; --muted:#6B7688; --line:#E4E8F0; --green:#1F9D55; --red:#D64545; --amber:#C98A1B; --radius:14px; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--ink);min-height:100vh}
  .app{display:flex;min-height:100vh}
  .sidebar{width:180px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .logo{font-size:18px;font-weight:700;letter-spacing:.3px;margin-bottom:24px;display:flex;align-items:center;gap:10px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
  .navlink{padding:11px 12px;border-radius:9px;cursor:pointer;color:#C7D0E2;font-size:14px;display:flex;gap:10px;align-items:center}
  .navlink:hover{background:var(--navy-2);color:#fff}
  .navlink.active{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
  .navlink .ico{width:18px;text-align:center}
  .sidebar .spacer{flex:1}
  .sidebar .foot{font-size:11px;color:#7E8DAB;line-height:1.5;padding:10px 12px;border-top:1px solid #2A3E63}
  .sidebar2{width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;overflow-y:auto;max-height:100vh}
  .s2title{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:0 10px;margin-bottom:9px;font-weight:700}
  .s2link{padding:9px 11px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .s2link:hover{background:var(--bg)}
  .s2link.active{background:#FDF3E0;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
  .s2link .cnt{font-size:11px;color:var(--muted);font-weight:400}
  .s2sub{font-size:11px;color:var(--muted)}
  .s2add{margin:10px 0 0;padding:9px 11px;border:1.5px dashed #C7D0E2;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:center}
  .s2add:hover{border-color:var(--gold);color:var(--ink)}
  .main{flex:1;padding:28px 32px;max-width:1050px;min-width:0}
  h1{font-size:23px;font-weight:700}
  .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
  .stats{display:flex;gap:14px;margin:22px 0;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;flex:1;min-width:130px}
  .stat .n{font-size:26px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(22,41,74,.08);transform:translateY(-2px)}
  .card h3{font-size:15.5px;margin-bottom:5px}
  .card .ind{font-size:12.5px;color:var(--muted)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
  .badge.active{background:#E4F5EC;color:var(--green)}
  .badge.free{background:#E4F5EC;color:var(--green)}
  .badge.free_tier{background:#FDF3E0;color:var(--amber)}
  .badge.paid{background:#FBE7E7;color:var(--red)}
  .badge.usage_fees{background:#FDF3E0;color:var(--amber)}
  .badge.connected{background:#E4F5EC;color:var(--green)}
  .badge.disconnected{background:#EEF1F6;color:var(--muted)}
  .badge.error{background:#FBE7E7;color:var(--red)}
  .badge.pending{background:#FDF3E0;color:var(--amber)}
  .card .cat{position:absolute;top:18px;right:18px;font-size:11px}
  .addcard{border:2px dashed #C7D0E2;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);min-height:120px}
  .addcard:hover{border-color:var(--gold);color:var(--ink)}
  .addcard .plus{font-size:26px;color:var(--gold)}
  button{cursor:pointer;font-family:inherit}
  .btn{background:var(--gold);border:none;color:#fff;font-weight:600;padding:10px 18px;border-radius:9px;font-size:13.5px}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:7px}
  .tabs{display:flex;gap:6px;margin:18px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{padding:10px 16px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--ink);font-weight:600;border-color:var(--gold)}
  .modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .module{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
  .module .mn{font-weight:600;font-size:14px}
  .module .mc{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .module .md{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  th{background:#FAFBFD;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:11px 14px}
  td{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .costline{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  .modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:16px;padding:26px;width:420px;max-width:92vw;max-height:88vh;overflow:auto}
  .modal h3{margin-bottom:16px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit}
  .field textarea{min-height:60px;resize:vertical}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:99;opacity:0;transform:translateY(10px);transition:.25s}
  .toast.show{opacity:1;transform:none}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .kpi .kn{font-size:13px;font-weight:600}
  .kpi .kt{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi .kv{font-size:22px;font-weight:700;margin-top:8px}
  .kpi .kv small{font-size:12px;font-weight:500;color:var(--muted)}
  .kpi .kbiz{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:700}
  .syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .hint{font-size:12px;color:var(--muted);background:#FDF3E0;border:1px solid #F3E3C3;padding:9px 13px;border-radius:9px;margin-bottom:16px;line-height:1.5}
  .liveflag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .intgrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#FAFBFD;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12.5px}
  .chk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:7px;font-size:13.5px;cursor:pointer}
  .chk:hover{border-color:var(--gold)}
  .chk .box{width:18px;height:18px;border-radius:5px;border:2px solid #C7D0E2;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .chk.done{opacity:.62}
  .chk.done .box{background:var(--green);border-color:var(--green)}
  .chk .grow{flex:1}
  .chk .meta{font-size:11.5px;color:var(--muted)}
  .prog{height:7px;background:#EEF1F6;border-radius:6px;overflow:hidden;margin:8px 0 16px}
  .prog .fill{height:100%;background:var(--gold);border-radius:6px;transition:.3s}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="dot"></span>Business OS</div>
    <div class="navlink active" data-view="business"><span class="ico">▦</span> Business</div>
    <div class="navlink" data-view="sales"><span class="ico">↗</span> Sales</div>
    <div class="navlink" data-view="marketing"><span class="ico">◎</span> Marketing</div>
    <div class="navlink" data-view="finance"><span class="ico">$</span> Finance</div>
    <div class="navlink" data-view="settings"><span class="ico">⚙</span> Settings</div>
    <div class="spacer"></div>
    <div style="padding:0 12px 8px"><span class="liveflag" id="liveflag">● loading…</span></div>
    <div class="foot">Integration-agnostic · Free-first<br>No hardcoded business limit</div>
  </aside>
  <aside class="sidebar2" id="sidebar2"></aside>
  <main class="main" id="main"><div style="padding:60px;color:var(--muted)">Loading Business OS…</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
let DB = {businesses:[],providers:[],accounts:[],modules:[],bizmodules:[],kpiDefs:[],kpiActuals:[],users:[],access:[],metrics:[],steps:[]};
let view='business', sub='all', tab='overview';

async function loadAll(){
  const [b,p,a,m,bm,kd,ka,u,ac,mt,st] = await Promise.all([
    sb.from('businesses').select('*').order('id'),
    sb.from('integration_providers').select('*').order('id'),
    sb.from('external_accounts').select('*').order('id'),
    sb.from('module_catalog').select('*').order('id'),
    sb.from('business_modules').select('*').order('id'),
    sb.from('kpi_definitions').select('*').order('id'),
    sb.from('kpi_actuals').select('*').order('id'),
    sb.from('users').select('*').order('id'),
    sb.from('user_business_access').select('*').order('id'),
    sb.from('provider_metrics').select('*').order('id'),
    sb.from('onboarding_steps').select('*').order('id')
  ]);
  if(b.error||p.error||a.error||m.error||bm.error||kd.error||ka.error||u.error||ac.error||mt.error||st.error){
    const e=[b,p,a,m,bm,kd,ka,u,ac,mt,st].find(x=>x.error); throw new Error('db read failed: '+(e&&e.error?e.error.message:''));
  }
  DB.businesses=b.data; DB.providers=p.data; DB.accounts=a.data; DB.modules=m.data; DB.bizmodules=bm.data;
  DB.kpiDefs=kd.data; DB.kpiActuals=ka.data; DB.users=u.data; DB.access=ac.data; DB.metrics=mt.data; DB.steps=st.data;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`;}
function costBadge(cm){return `<span class="badge ${esc(cm)}">${cm==='free'?'Free':cm==='free_tier'?'Free tier':cm==='paid'?'Paid':'Usage fees'}</span>`;}
function relId(v){return v&&typeof v==='object'?(v.id??''):v;}
function bizName(id){const b=DB.businesses.find(x=>String(x.id)===String(relId(id)));return b?b.name:'—';}

const SECTIONS={
  business:{title:'Businesses', kpiRx:null},
  sales:{title:'Sales', kpiRx:/(sale|lead|pipeline|deal|revenue|conversion|churn)/i},
  marketing:{title:'Marketing', kpiRx:/(market|growth|traffic|seo|social|follower|campaign|reach)/i},
  finance:{title:'Finance', kpiRx:/(financ|revenue|mrr|profit|cash|expense|margin|cost|invoice)/i},
  settings:{title:'Settings', kpiRx:null}
};
function kpisFor(view,bizId){
  const rx=SECTIONS[view].kpiRx;
  return DB.kpiDefs.filter(k=>(bizId==='all'||String(relId(k.business_id))===String(bizId))&&(!rx||(rx.test(k.name)||rx.test(k.category||''))));
}
function bizAccounts(bizId){return DB.accounts.filter(a=>String(relId(a.business_id))===String(bizId));}
function bizKpis(bizId){return DB.kpiDefs.filter(k=>String(relId(k.business_id))===String(bizId));}

document.querySelectorAll('.navlink').forEach(n=>n.onclick=()=>{view=n.dataset.view;sub='all';tab='overview';document.querySelectorAll('.navlink').forEach(x=>x.classList.toggle('active',x===n));render();});

function renderS2(){
  const el=document.getElementById('sidebar2'); const s=SECTIONS[view];
  if(view==='settings'){
    el.innerHTML=`<div class="s2title">Settings</div>
      ${[['providers','Provider Registry'],['users','Users & Access'],['modules','Modules Catalog']].map(([id,label])=>
        `<div class="s2link ${sub===id?'active':''}" onclick="sub='${id}';render()">${label}</div>`).join('')}`;
    return;
  }
  if(view==='business'){
    el.innerHTML=`<div class="s2title">${s.title}</div>
      <div class="s2link ${sub==='all'?'active':''}" onclick="sub='all';render()"><span>All Businesses</span><span class="cnt">${DB.businesses.length}</span></div>
      ${DB.businesses.map(b=>{
        const k=bizKpis(b.id).length, c=bizAccounts(b.id).filter(a=>a.status==='connected').length;
        return `<div class="s2link ${String(sub)===String(b.id)?'active':''}" onclick="sub=${b.id};tab='overview';render()"><span>${esc(b.name)}</span><span class="cnt">${k} KPI · ${c} int</span></div>`;}).join('')}
      <div class="s2add" onclick="showAddBusiness()">+ Add Business</div>`;
    return;
  }
  el.innerHTML=`<div class="s2title">${s.title}</div>
    <div class="s2link ${sub==='all'?'active':''}" onclick="sub='all';render()"><span>All Businesses</span><span class="cnt">${kpisFor(view,'all').length} KPIs</span></div>
    ${DB.businesses.map(b=>{
      const k=kpisFor(view,b.id).length;
      return `<div class="s2link ${String(sub)===String(b.id)?'active':''}" onclick="sub=${b.id};render()"><span>${esc(b.name)}</span><span class="cnt">${k?k+' KPI':''}&nbsp;</span></div>`;}).join('')}`;
}

function render(){
  renderS2();
  const el=document.getElementById('main');
  if(view==='settings'){
    if(sub==='providers')return renderProviders(el);
    if(sub==='users')return renderUsers(el);
    if(sub==='modules')return renderModules(el);
    return renderProviders(el);
  }
  if(view==='business'){
    if(sub==='all')return renderPortfolio(el);
    const b=DB.businesses.find(x=>String(x.id)===String(sub));
    if(b)return renderBusinessWorkspace(el,b);
  }
  return renderSection(el);
}

/* ---------- BUSINESS: portfolio + workspace ---------- */
function renderPortfolio(el){
  const act=DB.businesses.filter(b=>b.status==='active').length;
  const conns=DB.accounts.filter(a=>a.status==='connected').length;
  el.innerHTML=`
    <div class="topbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div><h1>Portfolio</h1>
      <div class="sub">One parent portfolio · every business provisioned identically · scales from 13 to 500+ with no code change</div></div>
      <button class="btn" onclick="showAddBusiness()">+ Add Business</button></div>
    <div class="stats">
      <div class="stat"><div class="n">${DB.businesses.length}</div><div class="l">Businesses</div></div>
      <div class="stat"><div class="n">${act}</div><div class="l">Active</div></div>
      <div class="stat"><div class="n">${DB.modules.length}</div><div class="l">Standard modules</div></div>
      <div class="stat"><div class="n">${conns}</div><div class="l">Connected integrations</div></div>
      <div class="stat"><div class="n">${DB.providers.length}</div><div class="l">Providers in registry</div></div>
    </div>
    <div class="grid">
      ${DB.businesses.map(b=>{
        const n=bizAccounts(b.id).filter(a=>a.status==='connected').length;
        return `<div class="card" onclick="sub=${b.id};tab='overview';render()">
          <h3>${esc(b.name)}</h3><div class="ind">${esc(b.industry||'—')}</div>
          <div style="margin-top:12px;font-size:12px;color:var(--muted)">Business ID ${b.id} · ${n} connected integration${n===1?'':'s'} · ${bizKpis(b.id).length} KPIs</div>
          ${badge(b.status)}</div>`;}).join('')}
      <div class="card addcard" onclick="showAddBusiness()"><div class="plus">+</div><div>Add a new business — auto-provisioned</div></div>
    </div>`;
}

function renderBusinessWorkspace(el,b){
  const accounts=bizAccounts(b.id), kpis=bizKpis(b.id);
  const enabledMods=DB.bizmodules.filter(x=>String(relId(x.business_id))===String(b.id)&&x.enabled)
    .map(x=>DB.modules.find(m=>String(m.id)===String(relId(x.module_id)))).filter(Boolean);
  const side=[...new Set((enabledMods.length?enabledMods:DB.modules).map(m=>m.name))];
  el.innerHTML=`
    <div class="topbar"><div><h1>${esc(b.name)}</h1>
      <div class="sub">${esc(b.industry||'')} · Business ID ${b.id} · ${esc(b.slug||'')}</div></div>
      ${badge(b.status)}</div>
    <div class="tabs">
      ${['overview','integrations','kpis','settings'].map(t=>`<div class="tab ${tab===t?'active':''}" onclick="tab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}
    </div><div style="display:flex;gap:26px;align-items:flex-start">
      <div style="width:170px;flex-shrink:0">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Standard modules</div>
        ${side.map(m=>`<div style="padding:8px 10px;border-radius:8px;font-size:13px;background:#fff;border:1px solid var(--line);margin-bottom:6px">${esc(m)}</div>`).join('')}
      </div>
      <div style="flex:1;min-width:0">${tab==='overview'?bizOverview(b,accounts,kpis):tab==='integrations'?tabIntegrations(b,accounts):tab==='kpis'?bizKpiPanel(b,kpis):bizSettings(b)}</div>
    </div>`;
}

function bizOverview(b,accounts,kpis){
  const conns=accounts.filter(a=>a.status==='connected').length;
  const latest=kpis.map(k=>{const a=DB.kpiActuals.filter(x=>String(relId(x.kpi_id))===String(k.id)).sort((x,y)=>String(y.period).localeCompare(String(x.period)))[0];return a?a.actual_value:null;}).filter(v=>v!==null);
  return `
    <div class="stats" style="margin-top:0">
      <div class="stat"><div class="n">${conns}</div><div class="l">Connected integrations</div></div>
      <div class="stat"><div class="n">${kpis.length}</div><div class="l">KPIs tracked</div></div>
      <div class="stat"><div class="n">${DB.modules.length}</div><div class="l">Modules enabled</div></div>
      <div class="stat"><div class="n">${latest.length?latest[latest.length-1]:'—'}</div><div class="l">Latest KPI actual</div></div>
    </div>
    ${checklistHtml(b)}
    <div style="height:14px"></div>
    <div class="hint">All metrics for ${esc(b.name)} live here: KPIs with targets vs actuals, connected integrations, and configuration. Providers are configurable and replaceable — nothing is hardcoded.</div>
    ${kpis.length?`<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Metrics</div>
    <div class="kpis">${kpiCards(kpis,false)}</div>`:`<div class="empty">No KPIs defined yet for this business. Define the first one to start tracking metrics.</div>`}
    <div style="height:18px"></div>
    <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Integrations</div>
    ${accounts.filter(a=>a.status==='connected').map(a=>{
      const mt=DB.metrics.filter(x=>String(relId(x.account_id))===String(a.id));
      return `<div class="intgrow"><span><span class="syncdot" style="background:var(--green)"></span>${esc(a.display_name||'account')} <span class="s2sub">· ${esc(provName(a.provider_id))}</span></span><span>${badge(a.status)}</span></div>`+
      (mt.length?`<div style="display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 10px">${mt.map(x=>`<span style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px"><b>${esc(x.metric)}</b> ${esc(x.value)} <span class="s2sub">· 28d</span></span>`).join('')}</div>`:'');
    }).join('')||'<div class="empty">No integrations connected yet.</div>'}`;
}
function provName(id){const p=DB.providers.find(x=>String(x.id)===String(relId(id)));return p?p.name:'provider';}

/* ---------- LIVE GOOGLE INTEGRATIONS (OAuth from the app) ---------- */
let gToken=null, gTokenExp=0, gTokenClient=null;
function gScopes(){return 'https://www.googleapis.com/auth/analytics.readonly https://www.googleapis.com/auth/webmasters.readonly';}
async function ensureGsiLoaded(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}
async function gAuthToken(interactive){
  if(gToken&&Date.now()<gTokenExp-60000)return gToken;
  if(!CONFIG.googleClientId)throw new Error('NO_CLIENT_ID');
  await ensureGsiLoaded();
  return new Promise((res,rej)=>{
    gTokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.googleClientId,scope:gScopes(),
      callback:t=>{if(t.error)return rej(new Error(t.error));gToken=t.access_token;gTokenExp=Date.now()+(t.expires_in||3600)*1000;res(gToken);},
      error_callback:e=>rej(new Error(e.type||'popup_closed'))});
    gTokenClient.requestAccessToken(interactive===false?{prompt:''}:{prompt:''});
  });
}
async function gFetch(url,opts){
  const t=await gAuthToken(false);
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+t,'Content-Type':'application/json'},(opts&&opts.headers)||{})}));
  if(!r.ok)throw new Error('Google API '+r.status); return r.json();
}
async function ga4ListProperties(){
  const data=await gFetch('https://analyticsadmin.googleapis.com/v1beta/accountSummaries');
  const out=[];(data.accountSummaries||[]).forEach(a=>(a.propertySummaries||[]).forEach(p=>out.push({id:p.property,display:p.displayName})));
  return out;
}
async function ga4FetchMetrics(propId){
  const data=await gFetch('https://analyticsdata.googleapis.com/v1beta/'+propId+':runReport',{method:'POST',body:JSON.stringify({dateRanges:[{startDate:'28daysAgo',endDate:'today'}],metrics:[{name:'sessions'},{name:'activeUsers'},{name:'screenPageViews'}]})});
  const row=(data.rows&&data.rows[0])||null;
  return {sessions:row?Number(row.metricValues[0].value):0,users:row?Number(row.metricValues[1].value):0,pageviews:row?Number(row.metricValues[2].value):0};
}
async function gscListSites(){
  const data=await gFetch('https://www.googleapis.com/webmasters/v3/sites');
  return (data.siteEntry||[]).filter(s=>s.permissionLevel!=='siteUnverifiedUser').map(s=>({url:s.siteUrl,level:s.permissionLevel}));
}
async function gscFetchMetrics(siteUrl){
  const data=await gFetch('https://www.googleapis.com/webmasters/v3/sites/'+encodeURIComponent(siteUrl)+'/searchAnalytics/query',{method:'POST',body:JSON.stringify({startDate:new Date(Date.now()-28*864e5).toISOString().slice(0,10),endDate:new Date().toISOString().slice(0,10),dimensions:[]})});
  const row=(data.rows&&data.rows[0])||null;
  return {clicks:row?row.clicks:0,impressions:row?row.impressions:0,ctr:row?Math.round((row.ctr||0)*1000)/10:0};
}
async function persistGoogleMetrics(bizId,provName,ref,name,metrics){
  const prov=DB.providers.find(p=>p.name===provName);
  let acc=DB.accounts.find(a=>String(relId(a.business_id))===String(bizId)&&String(relId(a.provider_id))===String(prov.id)&&a.status==='connected');
  if(!acc){
    const ins=await sb.from('external_accounts').insert({business_id:bizId,provider_id:prov.id,display_name:name,external_account_ref:ref,data_selection:'last 28 days auto-sync',status:'connected',connected_at:new Date().toISOString()}).select().single();
    if(ins.error)return toast('Failed: '+ins.error.message); acc=ins.data;
    await sb.from('integration_sync_log').insert({account_id:acc.id,name:'Google OAuth connect',status:'success',started_at:new Date().toISOString(),finished_at:new Date().toISOString()});
  }else{
    await sb.from('external_accounts').update({external_account_ref:ref,display_name:name}).eq('id',acc.id);
  }
  const rows=Object.entries(metrics).map(([k,v])=>({name:provName+' metric',account_id:acc.id,business_id:bizId,metric:k,value:v,start_date:'28daysAgo',end_date:'today',fetched_at:new Date().toISOString()}));
  await sb.from('provider_metrics').insert(rows);
  await sb.from('onboarding_steps').update({done:true,completed_at:new Date().toISOString()})
    .eq('business_id',bizId).ilike('label',provName.includes('Analytics')?'Connect Google Analytics%':'Connect Google Search Console%');
  return acc;
}
async function connectGoogle(bizId,kind){
  if(!CONFIG.googleClientId){
    modal(`<h3>One-time Google setup needed</h3>
    <div class="hint">To let the app connect to Google directly, create an OAuth Client ID (2 minutes, free):<br><br>
    1. Open <b>console.cloud.google.com</b> → APIs &amp; Services → enable <b>Google Analytics Data API</b> and <b>Search Console API</b><br>
    2. Credentials → <b>Create OAuth client ID</b> → type <b>Web application</b><br>
    3. Add Authorized JavaScript origin: <b>${esc(location.origin)}</b><br>
    4. Copy the Client ID (ends in .apps.googleusercontent.com) and send it to Juno</div>
    <div class="actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">Got it</button></div>`);
    return;
  }
  try{
    toast('Opening Google sign-in…');
    await gAuthToken(true);
    if(kind==='ga4'){
      const props=await ga4ListProperties();
      if(!props.length)return toast('No GA4 properties visible for this Google account');
      pickModal('Choose a GA4 property',props.map(p=>({v:p.id,l:p.displayName||p.display+' ('+p.id+')'})),async id=>{
        const m=await ga4FetchMetrics(id);
        const meta=props.find(x=>x.v===id); const label=meta?meta.display||meta.displayName:'GA4 property';
        await persistGoogleMetrics(bizId,'Google Analytics 4',id,label,m);
        toast('✅ '+label+' connected — '+m.sessions+' sessions in last 28 days');
        document.querySelector('.modal-bg').remove();await loadAll();render();
      });
    }else{
      const sites=await gscListSites();
      if(!sites.length)return toast('No verified Search Console properties for this Google account');
      pickModal('Choose a Search Console property',sites.map(s=>({v:s.url,l:s.url})),async url=>{
        const m=await gscFetchMetrics(url);
        await persistGoogleMetrics(bizId,'Google Search Console',url,url,m);
        toast('✅ Search Console connected — '+m.clicks+' clicks in last 28 days');
        document.querySelector('.modal-bg').remove();await loadAll();render();
      });
    }
  }catch(e){toast('Google connect failed: '+e.message);}
}
function pickModal(title,opts,cb){

function checklistHtml(biz){

  <div class="prog"><div class="fill" style="width:${pct}%"></div></div>
  ${steps.map(s=>`<div class="chk ${s.done?'done':''}" onclick="toggleStep(${s.id},${s.done?'false':'true'})">
    <div class="box">${s.done?'✓':''}</div><div class="grow">${esc(s.label)}</div>${s.done?'<div class="meta">done</div>':''}</div>`).join('')}`;
}

function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" onclick="if(event.target===this)this.remove()"><div class="modal">${html}</div></div>`);}

  <div class="field"><label>Slug</label><input id="nb-slug" placeholder="auto from name if left blank"></div>
  <div class="field"><label>Industry</label><input id="nb-industry"></div>
  <div class="field"><label>Notes (current external stack — illustrative)</label><textarea id="nb-notes"></textarea></div>
  <div class="actions"><button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button>
  <button class="btn" onclick="submitBusiness()">Provision business</button></div>`);
}
async function submitBusiness(){
  const name=document.getElementById('nb-name').value.trim();
  if(!name)return toast('Business name is required');
  const slug=document.getElementById('nb-slug').value.trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const payload={name,slug,status:'active',industry:document.getElementById('nb-industry').value.trim(),created_at:new Date().toISOString(),notes:document.getElementById('nb-notes').value.trim()};
  const {data,error}=await sb.from('businesses').insert(payload).select().single();
  if(error)return toast('Provisioning failed: '+error.message);
  await sb.from('business_modules').insert(DB.modules.map(m=>({name:m.name,business_id:data.id,module_id:m.id,enabled:true,config:'{}'})));
  if(DB.users[0])await sb.from('user_business_access').insert({name:'Owner access',user_id:DB.users[0].id,business_id:data.id,role:'owner',granted_at:new Date().toISOString()});
  toast(`✅ ${name} provisioned — workspace, ID ${data.id}, modules and integrations hub created`);
  document.querySelector('.modal-bg').remove();await loadAll();render();
}

  <div class="field"><label>External account reference</label><input id="cn-ref" placeholder="provider account / org ID"></div>

  <button class="btn" onclick="submitConnect(${bizId},${provId})">Connect</button></div>`);
}
async function submitConnect(bizId,provId){

  const {data,error}=await sb.from('external_accounts').insert(payload).select().single();
